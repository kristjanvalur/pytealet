name: tealet Build And Publish

"on":
  push:
    tags:
      - "tealet-v*"
      - "v*"
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.archs }})
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'tealet-v') ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: "x86_64 i686 aarch64"
          - os: macos-14
            archs: "x86_64"
            macosx_deployment_target: "10.13"
          - os: macos-14
            archs: "arm64"
            macosx_deployment_target: "11.0"
          - os: windows-2022
            archs: "AMD64 x86"
          - os: windows-11-arm
            archs: "ARM64"
    env:
      BUILD_LIBTEALET_FROM_SOURCE: "0"
      CIBW_ARCHS: ${{ matrix.archs }}
      CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-*"
      CIBW_SKIP: "*-musllinux*"
      CIBW_TEST_COMMAND: "python -c \"import _tealet; import tealet; print('wheel smoke ok')\""
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.macosx_deployment_target }}" >> "$GITHUB_ENV"

      - name: Set up QEMU (Linux cross-arch)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'tealet-v') ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: Publish tealet to PyPI and GitHub Releases
    needs:
      - build_wheels
      - build_sdist
    runs-on: ubuntu-latest
    environment: pypi-tealet
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/tealet-v') ||
      startsWith(github.ref, 'refs/tags/v'))
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten dist tree
        run: |
          mkdir -p publish-dist
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} publish-dist/ \;
          ls -la publish-dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish-dist/
          print-hash: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            tealet-v*) version="${tag#tealet-v}" ;;
            v*) version="${tag#v}" ;;
            *) version="$tag" ;;
          esac
          title="tealet v${version}"
          prerelease_args=()
          case "$version" in
            *a*|*b*|*rc*) prerelease_args+=(--prerelease) ;;
          esac

          changelog="CHANGELOG.md"
          repo="${{ github.repository }}"
          python3 - "$changelog" "$version" > notes.md <<'PY'
          import sys
          from pathlib import Path

          path, version = sys.argv[1:]
          lines = Path(path).read_text().splitlines(True)
          try:
              start = next(i for i, line in enumerate(lines) if line.startswith(f"## [{version}]"))
          except StopIteration:
              sys.exit(f"no ## [{version}] in {path}")
          body = lines[start + 1 :]
          end_ver = next((i for i, line in enumerate(body) if line.startswith("## ")), len(body))
          section = body[:end_ver]
          try:
              h = next(i for i, line in enumerate(section) if line.startswith("### Highlights"))
          except StopIteration:
              sys.exit(f"no ### Highlights under ## [{version}] in {path}")
          rest = section[h + 1 :]
          end = next((i for i, line in enumerate(rest) if line.startswith("### ")), len(rest))
          text = "".join(rest[:end]).strip()
          if not text:
              sys.exit(f"empty ### Highlights under ## [{version}] in {path}")
          print(text)
          PY
          printf '\n\nFull changelog: https://github.com/%s/blob/%s/%s\n' \
            "$repo" "$GITHUB_SHA" "$changelog" >> notes.md
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file notes.md --repo "$repo"
            gh release upload "$tag" publish-dist/* --clobber --repo "$repo"
          else
            gh release create "$tag" publish-dist/* --title "$title" --notes-file notes.md --repo "$repo" "${prerelease_args[@]}"
          fi
